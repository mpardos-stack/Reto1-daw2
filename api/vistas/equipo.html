<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro equipo de barberos | Barbería Catracha</title>
    <!-- Descripción que muestran los buscadores en los resultados -->
    <meta name="description" content="Conoce a Ross, Luis y Rolando, los barberos de Barbería Catracha en Zaragoza, y sus especialidades.">
    <link rel="stylesheet" href="../../assets/style.css">
    <!-- Hoja alternativa: solo se nota cuando <html> tiene data-tema="claro" -->
    <link rel="stylesheet" href="../../assets/tema-claro.css">
    <!-- Se carga en el head para poner el tema antes de pintar la página (sin parpadeo) -->
    <script src="../../assets/js/tema.js"></script>
    <link rel="icon" href="../../assets/img/logo.png" type="image/png">
</head>
<body>

<div id="header"></div>

<main id="contenido">
    <section class="equipo-section">

        <header class="equipo-header">
            <p class="subtitle">PROFESIONALES DE CONFIANZA</p>
            <h1 class="titulo-principal">Nuestro Equipo</h1>
            <span class="underline" aria-hidden="true"></span>
            <p class="descripcion-header">
                Tres barberos con pasión, técnica y dedicación para darte el mejor resultado.
            </p>
        </header>

        <!-- Se rellena con /api/json/barberos.php -->
        <section class="equipo-grid" id="equipo-grid"></section>

        <!-- Plantilla de la tarjeta de cada barbero -->
        <template id="tpl-barbero">
            <section class="barbero-card">
                <section class="barbero-img">
                    <img src="" alt="" width="400" height="500" loading="lazy">
                </section>
                <section class="barbero-info">
                    <h2></h2>
                    <p class="rango"></p>
                    <p class="bio"></p>
                    <section class="tags"></section>
                </section>
            </section>
        </template>

        <section class="equipo-cta">
            <a href="reservas.html" class="btn-reservar-equipo">
                ELIGE TU BARBERO Y RESERVA
            </a>
        </section>

    </section>
</main>

<div id="footer"></div>

<script src="../../assets/js/layout.js"></script>
<script src="../../assets/js/equipo.js"></script>
</body>
</html>
