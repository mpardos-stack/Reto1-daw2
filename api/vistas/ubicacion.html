<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubicación - Barbería Catracha</title>
    <link rel="stylesheet" href="../../assets/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" href="../../assets/img/logo.png" type="image/png">
</head>
<body class="bg-dark">

<div id="header"></div>

<main class="ubicacion-page">

    <section class="ubicacion-header">
        <p class="subtitle">ENCUÉNTRANOS</p>
        <h1 class="titulo-principal">
            NUESTRA <span class="text-gold">UBICACIÓN</span>
        </h1>
        <section class="underline"></section>
        <p class="descripcion-header">
            Visítanos en el sector de San José, Zaragoza.
            Un espacio diseñado para ofrecerte el mejor servicio de barbería.
        </p>
    </section>

    <!-- Los datos se rellenan desde /api/json/ubicacion.php -->
    <section class="ubicacion-grid container">

        <article class="ubicacion-info">

            <!-- DIRECCIÓN -->
            <section class="info-item">
                <header class="info-header">
                    <i class="fas fa-map-marker-alt"></i>
                    <h2>DIRECCIÓN</h2>
                </header>
                <p id="ubi-direccion"></p>
            </section>

            <!-- HORARIOS -->
            <section class="info-item">
                <header class="info-header">
                    <i class="fas fa-clock"></i>
                    <h2>HORARIOS</h2>
                </header>
                <ul class="horario-lista" id="ubi-horarios"></ul>
            </section>

            <!-- CONTACTO -->
            <section class="info-item">
                <header class="info-header">
                    <i class="fas fa-phone-alt"></i>
                    <h2>CONTACTO</h2>
                </header>
                <p>Teléfono: <span id="ubi-telefono"></span></p>
                <p>WhatsApp: <span id="ubi-whatsapp"></span></p>
            </section>

        </article>

        <!-- MAPA -->
        <article class="ubicacion-mapa">
            <iframe id="ubi-mapa" allowfullscreen="" loading="lazy"></iframe>
        </article>

    </section>

    <section class="equipo-cta">
        <a href="reservas.html" class="btn-reservar-equipo">
            SOLICITAR CITA AHORA
        </a>
    </section>

</main>

<div id="footer"></div>

<script src="../../assets/js/layout.js"></script>
<script src="../../assets/js/ubicacion.js"></script>
</body>
</html>
